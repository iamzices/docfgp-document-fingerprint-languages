[build-system]
requires = ["poetry-core>=2.2"]
build-backend = "poetry.core.masonry.api"

[project]
name = "docfgp-languages"
version = "1.0.0"
description = "DocFGP Languages provides the Tesseract models DocFGP uses to OCR every script."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["docfgp", "ocr", "tesseract", "tessdata"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15"]

[tool.poetry]
packages = [{ include = "docfgp_languages", from = "src" }]
include = [{ path = "src/docfgp_languages/tessdata/**/*.traineddata", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = ">=3.11,<4"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D203", "D213", "D413"]

[tool.mypy]
python_version = "3.11"
files = ["src/docfgp_languages", "scripts"]
ignore_missing_imports = true
